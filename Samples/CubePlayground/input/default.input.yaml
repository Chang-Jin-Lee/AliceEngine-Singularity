# Each pair lists the negative key first and the positive key second.
schema: alice/input/1
name: Cube Preview Controls
actions:
  - name: MoveX
    type: axis
    bindings:
      - key.ad
  - name: MoveZ
    type: axis
    bindings:
      - key.ws
  - name: MoveY
    type: axis
    bindings:
      - key.control_space
  - name: RotateY
    type: axis
    bindings:
      - key.qe
  - name: Scale
    type: axis
    bindings:
      - key.fr
