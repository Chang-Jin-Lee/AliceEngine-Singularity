# FirstLight — 이 엔진으로 만드는 가장 작은 완전한 프로젝트.
#
# 여기 있는 파일 전부가 텍스트다. 컴파일할 코드가 하나도 없다.
# `alice check Samples/FirstLight` 로 전체를 검증할 수 있다.
schema: alice/project/1
name: FirstLight
version: 0.1.0
startScene: scenes/main.scene.yaml
contentRoot: .

renderer:
  backend: auto          # 플랫폼에 맞는 것을 알아서 고른다
  vsync: true
  targetFrameRate: 60
  resolution: [1600, 900]
  msaa: 4x

# 처음부터 예산을 선언한다. 넘으면 perf.budget.exceeded 로그가 나가고
# CI 가 그걸 회귀로 잡는다. 나중에 붙이는 게 아니라 시작부터 있는 것이 핵심이다.
budgets:
  Frame: 16.6
  Render: 8.0
  Physics: 2.0
  Animation: 1.0
  Audio: 0.5

logging:
  level: info
  channels:
    rhi: warn            # 렌더 병목을 쫓을 때만 trace 로 내린다
  jsonlPath: Logs/alice.jsonl

platforms: [windows, macos, linux, ios, android]
